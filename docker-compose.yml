# ============================================================================
# pulse-platform — single-host SOC integration stack
# ============================================================================
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose down
#
# Services bind to 127.0.0.1 only by design.
# ============================================================================

services:
  receiver:
    image: pulse-platform-receiver
    build:
      context: ./receiver
      dockerfile: Dockerfile
    container_name: pulse-receiver
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PULSE_RECEIVER_PORT}:${PULSE_RECEIVER_PORT}"
    environment:
      PULSE_RECEIVER_BIND: ${PULSE_RECEIVER_BIND}
      PULSE_RECEIVER_PORT: ${PULSE_RECEIVER_PORT}
      PULSE_SQLITE_DB: ${PULSE_SQLITE_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${PULSE_REDIS_PASS}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      PULSE_RECEIVER_TOKEN: ${PULSE_RECEIVER_TOKEN}
    volumes:
      - ./sqlite:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + str(${PULSE_RECEIVER_PORT}) + '/health', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    container_name: pulse-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PULSE_REDIS_PORT}:6379"
    volumes:
      - ./redis-data:/data
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --requirepass ${PULSE_REDIS_PASS}
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PULSE_REDIS_PASS}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  pulse-alert-worker:
    build: ./workers
    command: ["python", "-m", "workers.alert_worker"]
    depends_on: [redis, receiver]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${PULSE_REDIS_PASS}
      - PULSE_DISCORD_WEBHOOK=${PULSE_DISCORD_WEBHOOK}
      - PULSE_DB_PATH=/data/pulse.db
    volumes:
      - ./sqlite:/data
      - ./config:/app/config
    restart: unless-stopped

  pulse-digest-worker:
    build: ./workers
    command: ["python", "-m", "workers.digest_worker"]
    depends_on: [receiver]
    environment:
      - PULSE_DISCORD_WEBHOOK=${PULSE_DISCORD_WEBHOOK}
      - PULSE_DB_PATH=/data/pulse.db
    volumes:
      - ./sqlite:/data
      - ./config:/app/config
    restart: unless-stopped

networks:
  pulse-net:
    driver: bridge

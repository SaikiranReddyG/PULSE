# ============================================================================
# pulse-platform — single-host SOC integration stack
# ============================================================================
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose down
#
# Services bind to 127.0.0.1 only by design.
# ============================================================================

services:
  receiver:
    image: pulse-platform-receiver
    build:
      context: ./receiver
      dockerfile: Dockerfile
    container_name: pulse-receiver
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PULSE_RECEIVER_PORT}:${PULSE_RECEIVER_PORT}"
    environment:
      PULSE_RECEIVER_BIND: ${PULSE_RECEIVER_BIND}
      PULSE_RECEIVER_PORT: ${PULSE_RECEIVER_PORT}
      PULSE_SQLITE_DB: ${PULSE_SQLITE_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${PULSE_REDIS_PASS}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      - ./sqlite:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + str(${PULSE_RECEIVER_PORT}) + '/health', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    container_name: pulse-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PULSE_REDIS_PORT}:6379"
    volumes:
      - ./redis-data:/data
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --requirepass ${PULSE_REDIS_PASS}
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${PULSE_REDIS_PASS}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  n8n:
    image: n8nio/n8n:1.76.1
    container_name: pulse-n8n
    restart: unless-stopped
    profiles:
      - n8n
    ports:
      - "127.0.0.1:${PULSE_N8N_PORT}:5678"
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    volumes:
      - ./n8n-data:/home/node/.n8n
    depends_on:
      receiver:
        condition: service_started
    networks:
      - pulse-net

networks:
  pulse-net:
    driver: bridge

# ============================================================================
# codex-platform — single-host SOC integration stack
# ============================================================================
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose down
#
# Services bind to 127.0.0.1 only by design.
# ============================================================================

services:
  receiver:
    build:
      context: ./receiver
      dockerfile: Dockerfile
    container_name: codex-receiver
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODEX_RECEIVER_PORT}:${CODEX_RECEIVER_PORT}"
    environment:
      CODEX_RECEIVER_BIND: ${CODEX_RECEIVER_BIND}
      CODEX_RECEIVER_PORT: ${CODEX_RECEIVER_PORT}
      CODEX_SQLITE_DB: ${CODEX_SQLITE_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${CODEX_REDIS_PASS}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      - ./sqlite:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codex-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:' + str(${CODEX_RECEIVER_PORT}) + '/health', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    container_name: codex-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODEX_REDIS_PORT}:6379"
    volumes:
      - ./redis-data:/data
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --requirepass ${CODEX_REDIS_PASS}
    networks:
      - codex-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CODEX_REDIS_PASS}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: codex-grafana
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:${CODEX_GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${CODEX_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${CODEX_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./sqlite:/sqlite:ro
    depends_on:
      receiver:
        condition: service_started
    networks:
      - codex-net

  n8n:
    image: n8nio/n8n:1.76.1
    container_name: codex-n8n
    restart: unless-stopped
    profiles:
      - n8n
    ports:
      - "127.0.0.1:${CODEX_N8N_PORT}:5678"
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    volumes:
      - ./n8n-data:/home/node/.n8n
    depends_on:
      receiver:
        condition: service_started
    networks:
      - codex-net

networks:
  codex-net:
    driver: bridge

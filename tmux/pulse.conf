# Pulse ops session layout
# Window 0: dashboard (left) + logs (right)

# Set base index
set -g base-index 0

# Use 256 colors
set -g default-terminal "screen-256color"

# Status bar
set -g status-bg colour235
set -g status-fg colour136
set -g status-left "[pulse-ops] "
set -g status-right "%H:%M %d-%b"

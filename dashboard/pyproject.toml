[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-dashboard"
version = "0.2.0"
description = "Terminal dashboard for pulse-platform — Textual TUI reading SQLite directly."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.86.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pulse-dashboard = "pulse_dashboard.__main__:main"

[tool.setuptools]
packages = ["pulse_dashboard", "pulse_dashboard.widgets", "pulse_dashboard.screens"]

[tool.setuptools.package-data]
pulse_dashboard = ["styles.tcss"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dashboard"
version = "0.2.0"
description = "Terminal dashboard for codex-platform — Textual TUI reading SQLite directly."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.86.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
codex-dashboard = "codex_dashboard.__main__:main"

[tool.setuptools]
packages = ["codex_dashboard", "codex_dashboard.widgets", "codex_dashboard.screens"]

[tool.setuptools.package-data]
codex_dashboard = ["styles.tcss"]
